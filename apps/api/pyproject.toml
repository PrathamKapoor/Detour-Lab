[project]
name = "detour-lab-api"
version = "0.1.0"
description = "DETOUR LAB - pre-construction pedestrian detour decision support and model verification (API + authoritative domain engine)"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "PrathamKapoor", email = "prathamkapoor027@gmail.com" }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["detour_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:detour_lab.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's documented pattern is Depends(...) in the argument default.
"apps/api/detour_lab/api/v1/routers.py" = ["B008"]
# Nested `with` in the rollback tests is deliberate: it proves the inner block
# aborts the outer transaction.
"apps/api/tests/test_persistence.py" = ["SIM117"]